<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameHelper · 主机模式交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e16;color:#edf3ff;font:18px 'Segoe UI','Microsoft YaHei',sans-serif}button{font:inherit;color:inherit;background:#202d40;border:1px solid #43516a;border-radius:10px;padding:12px 20px;cursor:pointer}button:focus{outline:3px solid #adf5dc;outline-offset:4px;background:#354f60}button:hover{background:#354358}.screen{min-height:100vh;padding:26px 4vw 90px;background:radial-gradient(ellipse at 75% 30%,#1b3442,transparent 60%)}.review{color:#d0decf;font-size:15px;border-bottom:1px solid #394c50;padding-bottom:18px;display:flex;gap:26px;align-items:center}.review strong{color:#b6ffdc;white-space:nowrap}header{display:flex;align-items:center;gap:16px;margin:24px 0}header h2{margin:0;margin-right:auto;letter-spacing:3px;font-size:24px}small,.muted{color:#99aec2}.eyebrow{font-size:14px;letter-spacing:4px;color:#9edecb}h1{font-size:52px;margin:10px 0}p{line-height:1.65}.hero{display:flex;justify-content:space-between;align-items:center;margin:28px 0}.hero p{margin:8px 0}.stamp{font-size:76px;color:#83a5a933;font-weight:900;letter-spacing:10px}.tabs{display:flex;gap:12px;margin:18px 0}.active{background:#badfcc;color:#10251e}.shelf{display:flex;gap:24px;overflow-x:auto;padding:12px 8px 24px;scrollbar-width:none}.card{flex:0 0 210px;padding:0;text-align:left;background:transparent;border:0;transition:transform .15s}.card:focus{transform:translateY(-5px);background:transparent;border-radius:12px}.poster{height:272px;border-radius:10px;position:relative;overflow:hidden;padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,var(--c),#111829)}.poster:before{content:'';position:absolute;width:190px;height:190px;border:1px solid #ffffff40;transform:rotate(35deg);top:58px;left:80px;box-shadow:0 0 0 25px #ffffff08,0 0 0 65px #ffffff06}.poster b{font-size:29px;line-height:1.15;position:relative;max-width:160px}.poster small{position:relative;color:#ffffffae;letter-spacing:3px}.badge{font-size:13px;padding:7px 9px;border-radius:5px;position:relative;align-self:flex-start;font-weight:600}.full{color:#bdf8d7;background:#143d32}.partial{color:#ffe0a0;background:#59431b}.none{color:#ffe9e6;background:#913b38;border:1px solid #ff8a7b}.unknown{color:#d6e0f0;background:#3b4659}.card .meta{padding:12px 1px;font-size:15px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px;padding:10px 6px}.grid .poster{height:210px}.grid .card{min-width:0}.grid .poster b{font-size:24px}.legend{display:flex;gap:16px;margin-top:12px;font-size:14px;align-items:center}footer{position:fixed;bottom:0;left:0;right:0;padding:19px 4vw;background:#0c1322f5;border-top:1px solid #334052;display:flex;justify-content:space-between;gap:16px;font-size:15px;z-index:2}kbd{font:inherit;color:#d5ffe7;border:1px solid #6c8b85;border-radius:6px;padding:3px 7px;margin:0 5px}.shade{position:fixed;inset:0;background:#050914db;display:grid;place-items:center;z-index:5;backdrop-filter:blur(14px)}.dialog{width:min(1120px,90vw);max-height:90vh;overflow:auto;background:linear-gradient(130deg,#233748,#101b2c);border:1px solid #53697d;border-radius:20px;padding:36px;box-shadow:0 30px 100px #0009}.detail{display:grid;grid-template-columns:270px 1fr;gap:40px}.detail .poster{height:410px}.dialog h1{font-size:42px}.stats{display:flex;gap:35px;margin:26px 0}.stats b{display:block;font-size:26px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.primary{background:#b4efd7;color:#112c25}.keys{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin:22px 0}.keys button{padding:13px 5px}.searchline{padding:15px;background:#081321;border-radius:8px;font-size:26px}.spinner{width:55px;height:55px;border:4px solid #34485b;border-top-color:#b4efd7;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.empty{text-align:center;padding:40px}.desktop{text-align:center;padding:9vh 0}.desktop .actions{justify-content:center}#toast{position:fixed;right:4vw;top:135px;background:#b4efd7;color:#112c25;padding:15px;border-radius:10px;z-index:10}@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}.review{font-size:12px}h1{font-size:40px}.stamp{display:none}header{flex-wrap:wrap}.detail{grid-template-columns:200px 1fr}}
</style>
<div class="screen"><div class="review"><strong>交互原型 · 待确认</strong><span>① 布局 A / B　② 部分支持、Steam 未标注是否仍直接启动　③ 进入 / 退出入口与组合键　④ 主机模式是否编辑设置</span></div><header><h2>◈ GAMEHELPER <small> / 主机模式</small></h2><button id="layout" onclick="toggleLayout()"></button><button id="icons" onclick="ps=!ps;render()"></button><button onclick="entry()">入口 / 退出</button></header><main id="main"></main></div><footer id="help"></footer><div id="modal"></div><div id="toast" hidden></div>
<script>
// Throwaway prototype: two layouts, local fictional data, no real controller or launch integration.
const names=['星海余烬','苔原信使','回声之城','纸上王国','深蓝航线','霓虹疾驰','月下织梦','铁轨纪行','孤岛电台','微光花园','群星棋局','雨巷档案'];
const colors=['#526d91','#527b6e','#8d5664','#af7742','#246a8a','#815ca6','#6669a5','#566c59','#976752','#617f51','#627199','#666b7e'];
const labels=['✓ 完整支持','◐ 部分支持','! 不支持（Steam 未标注）','? 未知'];const classes=['full','partial','none','unknown'];
const games=names.map((name,i)=>({id:i,name,support:i%4,hours:[32.4,8.2,16,2.5,51,12.3,6.8,0,4.5,21,1.2,9][i],done:i%3===0,score:i%4===3?'未评分':['★★★★★','★★★★☆','★★★☆☆'][i%3],color:colors[i]}));
let variant=new URLSearchParams(location.search).get('variant')==='B'?'B':'A',ps=false,tab=0,query='',filter=0,selected=0,inMode=true,modalType='',returnFocus=null;
const tabs=['全部','最近','未通关','支持手柄'];const $=s=>document.querySelector(s);
function visible(){return games.filter(g=>(!query||g.name.includes(query))&&(tab!==1||g.id<6)&&(tab!==2||!g.done)&&(tab!==3||g.support===0)&&(filter===0||g.support===filter-1))}
function poster(g){return `<div class="poster" style="--c:${g.color}"><small>GH ORIGINAL / ${String(g.id+1).padStart(2,'0')}</small><b>${g.name}</b><span class="badge ${classes[g.support]}">${labels[g.support]}</span></div>`}
function render(focus=false){$('#layout').textContent=`布局 ${variant} · ${variant==='A'?'横向海报带':'分类网格'} [X]`;$('#icons').textContent=ps?'PS4 / PS5 图标':'Xbox 图标';$('#help').innerHTML=`<span><kbd>↑↓←→</kbd>导航 <kbd>${ps?'✕':'A'} / Enter</kbd>确认 <kbd>${ps?'○':'B'} / Esc</kbd>返回</span><span><kbd>${ps?'△':'Y'} / Y</kbd>搜索筛选 <kbd>${ps?'□':'X'} / X</kbd>布局 <kbd>${ps?'L1 / R1':'LB / RB'} / L / R</kbd>分类</span>`;
if(!inMode){$('#main').innerHTML=`<div class="desktop"><div class="eyebrow">桌面入口示意 · 不是真实系统托盘</div><h1>把客厅交给手柄</h1><p>监控与游戏库继续运行。以下三个入口都可返回全屏库。</p><div class="actions"><button onclick="enterMode()">托盘 → 进入主机模式</button><button onclick="enterMode()">游戏库 → 主机模式</button><button onclick="enterMode()">手柄组合键 → 进入</button></div><p class="muted">候选组合：LB + RB + Y / L1 + R1 + △<br>键盘模拟：同时按住 L + R + Y；仅此页面内生效。</p></div>`;return}
const list=visible();$('#main').innerHTML=`<div class="hero"><div><div class="eyebrow">YOUR NEXT ADVENTURE</div><h1>${variant==='A'?'今晚，继续冒险。':'你的游戏，整齐就位。'}</h1><p class="muted">${variant==='A'?'最近游玩在前 · 左右浏览海报，按确认查看详情':'按分类挑选 · 上下左右浏览，按确认查看详情'}　/　${list.length} 款</p></div><div class="stamp">PLAY.</div></div><nav class="tabs">${tabs.map((t,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()">${t}</button>`).join('')}<button onclick="search()">⌕ 搜索 / 筛选${query?' · '+query:''}${filter?' · '+labels[filter-1]:''}</button></nav><div class="${variant==='A'?'shelf':'grid'}" id="cards">${list.map(g=>`<button class="card" data-game="${g.id}" onclick="detail(${g.id})" aria-label="${g.name} ${labels[g.support]}">${poster(g)}<div class="meta">${g.name}<br><small>${g.hours} 小时 · ${g.done?'已通关':'游玩中'}${g.id<6?' · 最近游玩':''}</small></div></button>`).join('')}</div>${!list.length?'<div class="empty">没有匹配的游戏。<button onclick="query=\'\';filter=0;tab=0;render(true)">清除全部条件</button></div>':''}<div class="legend"><span class="muted">手柄标记</span>${labels.map((l,i)=>`<span class="badge ${classes[i]}">${l}</span>`).join('')}</div><p class="muted" style="font-size:13px">全部为虚构演示数据 · “Steam 未标注”不等于已证实不支持；未知表示尚无检索结果 · 本页只模拟键盘输入</p>`;if(focus)($('#cards button')||$('.tabs button')).focus()}
function toggleLayout(){variant=variant==='A'?'B':'A';const u=new URL(location);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render(true)}
function openModal(type,html){if(!modalType)returnFocus=document.activeElement;modalType=type;$('#modal').innerHTML=`<div class="shade"><section class="dialog" role="dialog" aria-modal="true">${html}</section></div>`;$('#modal button')?.focus()}
function closeModal(){modalType='';$('#modal').innerHTML='';if(returnFocus?.isConnected)returnFocus.focus();else $('#cards button')?.focus()}
function detail(id){selected=id;let g=games[id];openModal('detail',`<div class="detail">${poster(g)}<div><div class="eyebrow">游戏详情 / 虚构数据</div><h1>${g.name}</h1><span class="badge ${classes[g.support]}">${labels[g.support]}</span><p>${['可使用手柄完成主要游戏流程。','部分环节可能需要键盘或鼠标，例如文字输入。','Steam 未标注手柄能力，不能据此断定游戏不支持。请备好键鼠。','尚无可用检索结果。可以启动后自行确认。'][g.support]}<br><small>来源：模拟 Steam 元数据 · 非实际检索 · 不代表 Sony 原生图标支持</small></p><div class="stats"><span><b>${g.hours} h</b>累计时长</span><span><b>${g.done?'已通关':'游玩中'}</b>通关状态</span><span><b>${g.score}</b>最近本局打分</span></div><p class="muted">启动设置（只读）　HDR：${id%2?'关闭':'开启'}　·　倍速：1×<br>DS4Windows 预设：${id%2?'启用':'关闭'}（独立于游戏手柄支持标记）</p><div class="actions"><button class="primary" onclick="launch()">▶ 启动游戏</button><button onclick="notice('原型中设置只读；正式版是否允许手柄编辑待确认')">设置说明</button><button onclick="closeModal()">返回游戏库</button></div></div></div>`)}
function launch(){openModal('launch',`<div class="spinner"></div><h1>启动中 · ${games[selected].name}</h1><p>模拟：准备 HDR / 启动前动作 → 原入口启动 → 等待识别游戏进程</p><p class="muted">不会执行任何程序。真实产品需识别进程后才开始计时。<br>返回只关闭此覆盖层，不代表终止已经发出的启动请求。</p><div class="actions"><button onclick="detail(selected)">返回详情</button><button onclick="openModal('running','<h1>游戏运行中（模拟）</h1><p>前台已交给游戏；游戏退出后回到原详情位置。</p><button onclick=\"detail(selected)\">模拟游戏退出并返回</button>')">模拟识别到游戏</button></div>`)}
function search(){openModal('search',`<div class="eyebrow">手柄可达 / 屏幕键盘</div><h1>找一款游戏</h1><div class="searchline" id="query"></div><p class="muted">用方向键选择文字，确认输入；也可用鼠标点击。演示键盘覆盖所有示例游戏名。</p><div class="keys">${[...new Set(names.join(''))].map(c=>`<button onclick="query+='${c}';$('#query').textContent=query">${c}</button>`).join('')}</div><div class="actions"><button onclick="query=query.slice(0,-1);$('#query').textContent=query">退格</button><button onclick="query='';filter=0;search()">清空</button><button onclick="filter=(filter+1)%5;search()">手柄筛选：${filter?labels[filter-1]:'全部'}</button><button class="primary" onclick="closeModal();render(true)">查看结果</button></div>`);$('#query').textContent=query||'选择文字…'}
function entry(){openModal('entry',`<h1>进入 / 退出主机模式</h1><p>入口候选：系统托盘 → 进入主机模式；桌面游戏库 → 主机模式按钮。<br>组合键候选：LB + RB + Y / L1 + R1 + △（避免占用系统 Home 键）。</p><p class="muted">键盘模拟 L + R + Y。退出回到桌面库，后台监控继续。组合键方案待确认。</p><div class="actions"><button onclick="inMode=false;closeModal();render();$('#main button').focus()">退出到桌面示意</button><button onclick="closeModal()">留在主机模式</button></div>`)}
function enterMode(){inMode=true;render(true)}function notice(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3000)}
const held=new Set();document.addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>held.clear());
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();held.add(k);if(held.has('l')&&held.has('r')&&held.has('y')){e.preventDefault();held.clear();if(inMode)entry();else enterMode();return}if(k==='escape'){e.preventDefault();if(modalType==='launch'||modalType==='running')detail(selected);else if(modalType==='search'){closeModal();render(true)}else if(modalType)closeModal();else if(inMode)entry();return}if(!modalType&&inMode){if(k==='x'){e.preventDefault();toggleLayout();return}if(k==='y'){e.preventDefault();search();return}if(k==='l'||k==='r'){e.preventDefault();tab=(tab+(k==='l'?3:1))%4;render(true);return}}if(!k.startsWith('arrow'))return;e.preventDefault();let root=modalType?$('#modal'):document,buttons=[...root.querySelectorAll('button')].filter(b=>b.getBoundingClientRect().width),cur=document.activeElement;if(!buttons.includes(cur)){buttons[0]?.focus();return}let r=cur.getBoundingClientRect(),cx=r.x+r.width/2,cy=r.y+r.height/2;let best=null,score=Infinity;for(let b of buttons){if(b===cur)continue;let q=b.getBoundingClientRect(),dx=q.x+q.width/2-cx,dy=q.y+q.height/2-cy;let horizontal=k==='arrowleft'||k==='arrowright',forward=horizontal?dx:dy,cross=horizontal?dy:dx;if((k==='arrowleft'||k==='arrowup')?forward>=-3:forward<=3)continue;let s=Math.abs(forward)+Math.abs(cross)*4;if(s<score){score=s;best=b}}best?.focus();best?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})});render(true);
</script></html>
