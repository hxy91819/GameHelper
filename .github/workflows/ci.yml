name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**
  pull_request:
    branches:
      - main

jobs:
  core-build-and-test:
    name: Core/CLI Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build entire solution
        run: dotnet build GameHelper.sln --configuration Release

      - name: Test core and cli logic
        run: dotnet test GameHelper.Tests/GameHelper.Tests.csproj --configuration Release --no-build --verbosity normal

  console-publish-smoke:
    name: Console Publish Smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish and smoke test ConsoleHost
        shell: pwsh
        run: ./scripts/publish-console-smoke.ps1

  isolated-runtime-verify:
    name: Isolated Runtime Verify (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify isolated background runtime without deployment
        shell: pwsh
        run: |
          ./scripts/verify-on-machine.ps1 -SkipDeploy -VerifyRuntime -DiagnosticsDirectory "$env:RUNNER_TEMP/runtime-verify"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Background launch without console, sandbox data writes, ETW session and library IPC passed. No deployment performed." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload isolated instance diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-runtime-diagnostics
          path: ${{ runner.temp }}/runtime-verify
          if-no-files-found: warn
