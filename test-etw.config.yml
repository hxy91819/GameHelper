# Test configuration with ETW monitor
monitor: ETW
startup:
  autoStartMonitor: false
  launchOnStartup: false
games:
  - dataKey: notepad
    executable: notepad.exe
    displayName: Notepad
    enabled: true
    hdr: false
  - dataKey: cmd
    executable: cmd.exe
    displayName: Command Prompt
    enabled: true
    hdr: false
