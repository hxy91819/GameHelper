# addedAt 为工具新增游戏时记录的可选 ISO 8601 时间；旧条目无需补填，编辑或重复导入不会重置。
# Test configuration with ETW monitor
monitor: ETW
startup:
  launchOnStartup: false
# Optional; required only when a game entry sets speed.
# cheatEngine:
#   executable: C:\Program Files\Cheat Engine\cheatengine-x86_64-SSE4-AVX2.exe
#   speedHotkeys:          # optional defaults for games without their own speedHotkeys
#     - hotkey: Ctrl+F1
#       speed: 1.0
# 统计推送示例（默认关闭；完整字段见 docs/guides/sync.md）
sync:
  enabled: false
  provider: github
  method: git
  repo: yourname/game-stats
  directory: game-stats
  intervalMinutes: 1440
# 休息提醒默认关闭；完整规则见 docs/guides/break-reminder.md。
breakReminder:
  enabled: false
  playMinutes: 40
  breakMinutes: 5
  repeatMinutes: 10
  sound: true
# 显示器预设自动切换默认关闭；完整规则见 docs/guides/monitor-mode.md。
# U2720QM 默认护眼为单笔 F0=0x0C；其它型号可覆盖 comfortPresets。
# HDR 开启或状态无法确认时自动跳过 DDC；关闭后恢复规则。
monitorMode:
  enabled: false
games:
  - dataKey: notepad
    executable: notepad.exe
    displayName: Notepad
    enabled: true
    hdr: false
    # speed: 2.0
    # speedAttach: immediate
    # launch:
    #   target: C:\Windows\System32\notepad.exe
    #   ds4WindowsPath: C:\Tools\DS4Windows\DS4Windows.exe # 可选，省略即关闭
  - dataKey: cmd
    executable: cmd.exe
    displayName: Command Prompt
    enabled: true
    hdr: false

# 游戏库默认进入全屏主机模式
consoleModeOnLibraryOpen: false
